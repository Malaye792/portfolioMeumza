<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Immobilier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    #customers {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }
      
      #customers td, #customers th {
        border: 1px solid #ddd;
        padding: 8px;
      }
      
      #customers tr:nth-child(even){background-color: #f2f2f2;}
      
      #customers tr:hover {background-color: #ddd;}
      
      #customers th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #04AA6D;
        color: white;
      }
</style>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="logement.html">Logement</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="inscription.html">inscription</a></li>
            </ul>
        </nav>
        <div class="banner">
            <img src="banner.jpg" alt="Banner Image">
            <div class="banner-text">
                <h1>Bienvenue sur notre site immobilier</h1>
                <p>Trouvez la maison de vos rêves</p>
            </div>
        </div>
    </header>
    <main>
       
        <section id="contact" class="contact">
            <h2>Forumulaire d inscription</h2>
            <form>
                <div class="form-group">
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="email">Prenom:</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Site Immobilier. Tous droits réservés.</p>
    </footer>
</body>
</html>
